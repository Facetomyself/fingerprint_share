<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>环境指纹采集 - DataDome-radwell.com</title>
<style>
  body {{ margin: 0; padding: 24px; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    background: #0b0b12; color: #e8e8ec; }}
  h1 {{ font-size: 20px; margin: 0 0 6px; }}
  .muted {{ color: #8f8f9c; font-size: 12.5px; }}
  #fp-status {{ margin: 16px 0; padding: 12px 16px; border-radius: 10px;
    background: rgba(10,132,255,0.10); border: 1px solid rgba(10,132,255,0.3); font-size: 13.5px; }}
  #fp-status.ok {{ background: rgba(48,209,88,0.10); border-color: rgba(48,209,88,0.32); }}
  #fp-status.error {{ background: rgba(255,69,58,0.10); border-color: rgba(255,69,58,0.34); }}
</style>
</head>
<body>
<h1>DataDome-radwell.com</h1>
<p class="muted">此页面将采集你的浏览器环境指纹并存储与共享。仅用于风控研究对照。</p>
<div id="fp-status">正在采集环境指纹...</div>
<script src="collector.js"></script>
<script>
/* datadome-5.9.0-radwell 采集模板
 * 专有探测面（通用面由 generic-deep-v3 覆盖，本条目聚焦 DataDome tags.js 5.9.0 研究面）：
 *   - dd 全局变量形状（ddjskey/datadome/ddoptions 键名与类型，不读值）
 *   - eventCounters 初始计数结构（click/keydown/mousemove 监听状态）
 *   - cid 形状生成能力（时间戳 base36 + 随机，模拟 getDDSession 形状）
 *   - request envelope 输入面（location/referrer/脚本元素结构）
 *   - defineProperty 可覆写性（DataDome 埋点机制）
 *   - localStorage dd 键名集合
 * 来源：workspace/radwell（DataDome 5.9.0，jspl 九字段 envelope 研究）。
 * 契约：调用 window.__fp_submit(payload)；不含 "</" + "script" 字面量。
 */
(async function () {
  'use strict';

  var SCRIPT = 'datadome-5.9.0-radwell';
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  var w = window;
  var d = document;
  var n = w.navigator;
  var errors = [];
  var components = {};

  function sha256Hex(text) {
    if (w.crypto && w.crypto.subtle && w.crypto.subtle.digest) {
      return w.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
        var bytes = new Uint8Array(buf);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) {
          hex += ('0' + bytes[i].toString(16)).slice(-2);
        }
        return hex;
      });
    }
    var h = 0x811c9dc5;
    for (var j = 0; j < text.length; j++) {
      h ^= text.charCodeAt(j);
      h = (h * 0x01000193) >>> 0;
    }
    return Promise.resolve(('0000000' + h.toString(16)).slice(-8));
  }

  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }

  function safe(name, fn) {
    try {
      components[name] = fn();
    } catch (e) {
      components[name] = null;
      errors.push(name + ':' + (e && e.name ? e.name : 'error'));
    }
  }

  // ---------- dd 全局变量形状（键名与类型，不读值） ----------
  safe('ddGlobals', function () {
    var out = {};
    var keys = Object.getOwnPropertyNames(w).filter(function (k) {
      return /^dd|datadome/i.test(k) || k === 'ddjskey' || k === 'ddoptions';
    }).slice(0, 20);
    keys.forEach(function (k) {
      try {
        var desc = Object.getOwnPropertyDescriptor(w, k);
        out[k] = {
          typeof: typeof w[k],
          hasGet: desc ? typeof desc.get === 'function' : false
        };
      } catch (e) { out[k] = { error: e.name }; }
    });
    return out;
  });

  // ---------- eventCounters 初始结构（tags.js 行为计数器形状） ----------
  safe('eventCounters', function () {
    return {
      // 页面加载完成后的初始监听状态：本页未注入 tags.js，记录基线形状
      structure: ['click', 'keydown', 'mousemove', 'scroll', 'touchstart', 'xhr', 'fetch'],
      observedAt: new Date().toISOString(),
      domContentLoaded: d.readyState,
      eventListenersOnDocument: (function () {
        var count = 0;
        // 无法枚举已绑定监听器，记录包装层可用性
        return {
          addEventListenerNative: /\[native code\]/.test(Function.prototype.toString.call(d.addEventListener)),
          removeEventListenerNative: /\[native code\]/.test(Function.prototype.toString.call(d.removeEventListener))
        };
      })()
    };
  });

  // ---------- cid 形状生成能力（getDDSession 形状模拟） ----------
  safe('cidShape', function () {
    var ts = Date.now().toString(36);
    var rand = '';
    var alphabet = '0123456789abcdefghijklmnopqrstuvwxyz';
    for (var i = 0; i < 12; i++) {
      rand += alphabet[Math.floor(Math.random() * alphabet.length)];
    }
    var sample = ts + rand;
    return { length: sample.length, timestampBase36: ts.length, randomPart: 12 };
  });

  // ---------- request envelope 输入面 ----------
  safe('envelopeInputs', function () {
    var href = location.href;
    return {
      pathnameLength: location.pathname.length,
      searchLength: location.search.length,
      hashLength: location.hash.length,
      referrerLength: (d.referrer || '').length,
      hrefScheme: location.protocol,
      inlineScriptCount: Array.prototype.filter.call(d.scripts, function (s) {
        return !s.src;
      }).length,
      externalScriptCount: Array.prototype.filter.call(d.scripts, function (s) {
        return !!s.src;
      }).length,
      iframeCount: d.getElementsByTagName('iframe').length
    };
  });

  // ---------- defineProperty 可覆写性（DataDome 埋点机制探测） ----------
  safe('definePropertySurface', function () {
    var probe = {};
    try {
      Object.defineProperty(probe, 'x', { value: 1, configurable: true });
      probe.definePropertyWorks = true;
    } catch (e) { probe.definePropertyWorks = false; }
    var navigatorGetter = {};
    try {
      var desc = Object.getOwnPropertyDescriptor(Navigator.prototype, 'userAgent');
      navigatorGetter = {
        isAccessor: desc ? typeof desc.get === 'function' : false,
        configurable: desc ? desc.configurable : null
      };
    } catch (e) { navigatorGetter = { error: e.name }; }
    var frozenCheck = {};
    try {
      frozenCheck.navigatorSealed = Object.isSealed(n);
      frozenCheck.navigatorFrozen = Object.isFrozen(n);
    } catch (e) { frozenCheck = { error: e.name }; }
    return { definePropertyWorks: probe.definePropertyWorks, navigatorUserAgent: navigatorGetter, ...frozenCheck };
  });

  // ---------- localStorage dd 键名集合 ----------
  safe('storageDdKeys', function () {
    var out = { localStorage: [], sessionStorage: [] };
    try {
      for (var i = 0; i < w.localStorage.length; i++) {
        var key = w.localStorage.key(i);
        if (key && /^dd|datadome/i.test(key)) { out.localStorage.push(key); }
      }
    } catch (e) { out.localStorage = null; }
    try {
      for (var j = 0; j < w.sessionStorage.length; j++) {
        var skey = w.sessionStorage.key(j);
        if (skey && /^dd|datadome/i.test(skey)) { out.sessionStorage.push(skey); }
      }
    } catch (e) { out.sessionStorage = null; }
    return out;
  });

  // ---------- 组装上报 ----------
  var STABLE_KEYS = ['ddGlobals', 'eventCounters', 'envelopeInputs', 'definePropertySurface', 'storageDdKeys'];
  var stable = {};
  STABLE_KEYS.forEach(function (k) { stable[k] = components[k]; });
  var visitorId = await sha256Hex(JSON.stringify(stable));

  var payload = {
    script: SCRIPT,
    kind: 'environment',
    collectedAt: new Date().toISOString(),
    visitorId: visitorId,
    components: components,
    errors: errors,
    durationMs: Math.round(nowMs() - t0)
  };

  if (typeof w.__fp_submit === 'function') {
    w.__fp_submit(payload);
  }
})();

</script>
</body>
</html>
