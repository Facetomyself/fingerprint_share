<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>条目详情 - 指纹共享平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topnav">
  <div class="container">
    <span class="brand">指纹共享平台</span>
    <a href="/">导航</a>
    <a href="/admin/">后台</a>
  </div>
</header>
<main class="container">
  <div id="entry-root">
    <div class="status">正在加载条目...</div>
  </div>
</main>
<script src="/static/js/common.js"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('entry-root');
  var segments = pathSegments(); // ['e', '<slug>']
  var slug = segments.length >= 2 ? decodeURIComponent(segments[1]) : '';

  if (!slug) {
    root.innerHTML = '<div class="status error">URL 缺少条目标识</div>';
  } else {
    fetchJson('/api/entries/' + encodeURIComponent(slug)).then(function (e) {
      root.innerHTML =
        '<div class="hero"><h1>' + escapeHtml(e.name) + '</h1>' +
        '<p class="hero-sub">' + escapeHtml(e.risk_type) + ' · ' + escapeHtml(e.website) +
        ' · 版本 ' + escapeHtml(e.version) +
        ' · 更新于 ' + escapeHtml(shortTime(e.updated_at)) + '</p></div>' +
        '<div class="section"><h2>说明</h2><p>' + escapeHtml(e.description || '（无描述）') + '</p>' +
        '<p class="muted">采集脚本源码不提供下载（敏感），仅可经采集页在浏览器中执行。</p></div>' +
        '<div class="actions">' +
        '<a class="btn btn-primary" href="/collect/' + encodeURIComponent(e.slug) + '">打开环境采集页</a>' +
        '<a class="btn btn-primary" href="/collect/' + encodeURIComponent(e.slug) + '/behavior">打开行为采集页</a>' +
        '<a class="btn" href="/static/collections.html?entry=' + encodeURIComponent(e.slug) + '">浏览指纹数据</a>' +
        '<a class="btn" href="/">返回导航</a>' +
        '</div>';
    }).catch(function (err) {
      root.innerHTML = '<div class="status error">加载失败：' + escapeHtml(err.message) + '</div>';
    });
  }
})();
</script>
</body>
</html>
