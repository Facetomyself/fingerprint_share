<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台登录 - 指纹共享平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topnav">
  <div class="container">
    <span class="brand">指纹共享平台</span>
    <a href="/">导航</a>
  </div>
</header>
<main class="login-shell">
  <div class="section login-card">
    <h1 style="margin-top:4px;">后台登录</h1>
    <p class="muted">后台仅用于采集脚本的上传与管理。</p>
    <div id="login-status" class="hidden"></div>
    <form id="login-form">
      <label for="password">管理员密码</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" style="width:100%;">登录</button>
    </form>
  </div>
</main>
<script src="/static/js/common.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('login-form');
  var statusEl = document.getElementById('login-status');

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = document.getElementById('password').value;
    statusEl.className = 'hidden';
    fetchJson('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    }).then(function () {
      location.href = '/admin/';
    }).catch(function (err) {
      statusEl.className = 'status error';
      statusEl.textContent = '登录失败：' + err.message;
    });
  });
})();
</script>
</body>
</html>
