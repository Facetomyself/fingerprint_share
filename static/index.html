<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指纹共享平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topnav">
  <div class="container">
    <span class="brand">指纹共享平台</span>
    <a href="/">导航</a>
    <a href="/admin/">后台</a>
  </div>
</header>
<main class="container">
  <div class="hero">
    <h1>指纹共享平台</h1>
    <p class="hero-sub">按「风控类型-网站」分组的指纹采集条目。环境指纹与行为指纹分页采集，采集数据公开共享。</p>
    <div class="hero-stats" id="hero-stats"></div>
  </div>
  <div id="entries-root">
    <div class="status">正在加载条目...</div>
  </div>
</main>
<script src="/static/js/common.js"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('entries-root');

  function renderEntries(entries) {
    if (!entries.length) {
      root.innerHTML = '<div class="status">暂无条目。请从<a href="/admin/">后台</a>上传采集脚本。</div>';
      return;
    }
    var groups = groupBy(entries, function (e) { return e.risk_type; });
    var html = '';
    Object.keys(groups).sort().forEach(function (riskType) {
      html += '<h2 class="group-header">' + escapeHtml(riskType) + '</h2>';
      groups[riskType].forEach(function (e) {
        var behaviorLink = e.has_behavior
          ? '<a class="btn btn-primary" href="/collect/' + encodeURIComponent(e.slug) + '/behavior">行为采集页</a>'
          : '<span class="badge" title="该风控无行为指纹面证据，不提供行为采集">仅环境面</span>';
        html += '<div class="entry-card">' +
          '<div class="title">' + escapeHtml(e.name) + '</div>' +
          '<div class="desc">' + escapeHtml(e.description || '（无描述）') +
          ' <span class="muted">v' + escapeHtml(e.version) + '</span></div>' +
          '<div class="actions">' +
          '<a class="btn btn-primary" href="/collect/' + encodeURIComponent(e.slug) + '">环境采集页</a>' +
          behaviorLink +
          '<a class="btn" href="/static/collections.html?entry=' + encodeURIComponent(e.slug) + '">浏览指纹</a>' +
          '<a class="btn" href="/e/' + encodeURIComponent(e.slug) + '">详情</a>' +
          '</div></div>';
      });
    });
    root.innerHTML = html;
  }

  function renderHeroStats(entries) {
    var statsEl = document.getElementById('hero-stats');
    var promises = entries.map(function (e) {
      return fetchJson('/api/collections?entry_id=' + e.id + '&page=1').then(function (d) {
        return { name: e.name, total: d.total, slug: e.slug };
      }).catch(function () {
        return { name: e.name, total: 0, slug: e.slug };
      });
    });
    Promise.all(promises).then(function (rows) {
      var total = rows.reduce(function (acc, r) { return acc + r.total; }, 0);
      var html = '<span class="stat-chip">条目 ' + entries.length + '</span>' +
        '<span class="stat-chip">采集记录 ' + total + '</span>';
      rows.forEach(function (r) {
        html += '<span class="stat-chip">' + escapeHtml(r.name) + ' ' + r.total + '</span>';
      });
      statsEl.innerHTML = html;
    });
  }

  fetchJson('/api/entries').then(function (entries) {
    renderEntries(entries);
    renderHeroStats(entries);
  }).catch(function (err) {
    root.innerHTML = '<div class="status error">加载失败：' + escapeHtml(err.message) + '</div>';
  });
})();
</script>
</body>
</html>
