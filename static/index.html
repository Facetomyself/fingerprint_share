<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指纹共享平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topnav">
  <div class="container">
    <span class="brand">指纹共享平台</span>
    <a href="/">浏览</a>
    <a href="/admin/">管理后台</a>
  </div>
</header>
<main class="container">
  <div class="hero">
    <h1>指纹共享平台</h1>
    <p class="hero-sub">浏览器环境与行为指纹采集共享平台。按风控类型组织的环境指纹采集、行为指纹采集与指纹数据库，面向逆向研究与风控对照分析。</p>
    <div class="hero-search">
      <input id="search-input" type="text" placeholder="搜索风控类型、网站或指纹特征...">
    </div>
  </div>

  <div class="filter-chips" id="filter-chips"></div>

  <div class="card-grid" id="entries-root">
    <div class="status">正在加载条目...</div>
  </div>

  <p class="muted footer-stats" id="stat-row"></p>
</main>
<script src="/static/js/common.js"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('entries-root');
  var chipsRoot = document.getElementById('filter-chips');
  var statRow = document.getElementById('stat-row');
  var searchInput = document.getElementById('search-input');

  var allEntries = [];
  var activeFilter = 'all';
  var searchTerm = '';

  // 风控类型配色（封面渐变与标识色）
  var RISK_COLORS = {
    '通用': { c1: '#3a3a4a', c2: '#23232e' },
    'DataDome': { c1: '#c2541c', c2: '#7a2f10' },
    '瑞数6': { c1: '#b3261e', c2: '#6e130d' },
    '飞林': { c1: '#0e7490', c2: '#0a4557' },
    'Imperva': { c1: '#7c5cbf', c2: '#4a3382' },
    'BOSS': { c1: '#1e8a4c', c2: '#0f5c30' }
  };

  // 标准内容标签：从所有条目的 tags 并集生成常用标签 chips（按使用频次排序）
  function buildChips() {
    var tagCount = {};
    allEntries.forEach(function (e) {
      (e.tags || []).forEach(function (t) {
        tagCount[t] = (tagCount[t] || 0) + 1;
      });
    });
    var sortedTags = Object.keys(tagCount).sort(function (a, b) {
      return tagCount[b] - tagCount[a] || a.localeCompare(b);
    });
    var chips = [{ key: 'all', label: '全部' }];
    sortedTags.forEach(function (t) {
      chips.push({ key: 'tag:' + t, label: t + ' (' + tagCount[t] + ')' });
    });
    chipsRoot.innerHTML = '';
    chips.forEach(function (c) {
      var btn = document.createElement('button');
      btn.className = 'chip' + (activeFilter === c.key ? ' active' : '');
      btn.textContent = c.label;
      btn.addEventListener('click', function () {
        activeFilter = c.key;
        renderGrid();
        Array.prototype.forEach.call(chipsRoot.querySelectorAll('.chip'), function (b) {
          b.className = 'chip' + (b.textContent === c.label ? ' active' : '');
        });
      });
      chipsRoot.appendChild(btn);
    });
  }

  function matchesFilter(e) {
    if (activeFilter === 'all') { return true; }
    if (activeFilter.indexOf('tag:') === 0) {
      var tag = activeFilter.slice(4);
      return (e.tags || []).indexOf(tag) >= 0;
    }
    return true;
  }

  function matchesSearch(e) {
    if (!searchTerm) { return true; }
    var haystack = (e.name + ' ' + e.risk_type + ' ' + e.website + ' ' + e.description).toLowerCase();
    return haystack.indexOf(searchTerm.toLowerCase()) >= 0;
  }

  function coverGlyph(riskType) {
    // 封面视觉符号：纯 CSS 图形（无 emoji），按风控类型差异化
    var shapes = {
      '通用': 'circle', 'DataDome': 'diamond', '瑞数6': 'hex', '飞林': 'bars',
      'Imperva': 'shield', 'BOSS': 'square'
    };
    return shapes[riskType] || 'circle';
  }

  function renderCoverGlyph(glyph) {
    var common = 'display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.9;';
    if (glyph === 'diamond') {
      return '<span style="' + common + 'width:34px;height:34px;background:rgba(255,255,255,0.28);transform:translate(-50%,-50%) rotate(45deg);border-radius:6px;"></span>';
    }
    if (glyph === 'hex') {
      return '<span style="' + common + 'width:36px;height:36px;background:rgba(255,255,255,0.28);clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);"></span>';
    }
    if (glyph === 'bars') {
      return '<span style="' + common + 'display:flex;gap:4px;align-items:flex-end;height:36px;">' +
        '<span style="width:6px;height:18px;background:rgba(255,255,255,0.3);border-radius:2px;"></span>' +
        '<span style="width:6px;height:30px;background:rgba(255,255,255,0.3);border-radius:2px;"></span>' +
        '<span style="width:6px;height:24px;background:rgba(255,255,255,0.3);border-radius:2px;"></span></span>';
    }
    if (glyph === 'shield') {
      return '<span style="' + common + 'width:34px;height:38px;background:rgba(255,255,255,0.28);clip-path:polygon(50% 0%,100% 18%,88% 62%,50% 100%,12% 62%,0% 18%);"></span>';
    }
    if (glyph === 'square') {
      return '<span style="' + common + 'width:32px;height:32px;background:rgba(255,255,255,0.28);border-radius:8px;"></span>';
    }
    return '<span style="' + common + 'width:36px;height:36px;background:rgba(255,255,255,0.28);border-radius:50%;"></span>';
  }

  function renderGrid() {
    var filtered = allEntries.filter(matchesFilter).filter(matchesSearch);
    if (!filtered.length) {
      root.innerHTML = '<div class="status">没有符合条件的条目。请调整筛选条件或从<a href="/admin/">管理后台</a>创建条目。</div>';
      return;
    }
    var html = '';
    filtered.forEach(function (e) {
      var color = RISK_COLORS[e.risk_type] || { c1: '#3a3a4a', c2: '#23232e' };
      var tagsHtml = (e.tags || []).map(function (t, idx) {
        var cls = idx === 0 ? 'mini-tag tag-main' : 'mini-tag';
        return '<span class="' + cls + '">' + escapeHtml(t) + '</span>';
      }).join('');
      html += '<div class="risk-card" style="--risk-c1:' + color.c1 + ';--risk-c2:' + color.c2 + ';">' +
        '<a class="card-cover" href="/e/' + encodeURIComponent(e.slug) + '">' +
        renderCoverGlyph(coverGlyph(e.risk_type)) +
        '<span class="cover-count">' + (e.recordCount || 0) + ' 条记录</span>' +
        '</a>' +
        '<div class="card-body">' +
        '<a class="card-title" href="/e/' + encodeURIComponent(e.slug) + '">' + escapeHtml(e.name) + '</a>' +
        '<div class="card-tags">' + tagsHtml + '</div>' +
        '<p class="card-desc">' + escapeHtml((e.description || '暂无描述').slice(0, 72)) + (e.description && e.description.length > 72 ? '...' : '') + '</p>' +
        '<div class="card-actions">' +
        '<a class="btn btn-primary" href="/collect/' + encodeURIComponent(e.slug) + '">环境指纹采集</a>' +
        (e.has_behavior
          ? '<a class="btn" href="/collect/' + encodeURIComponent(e.slug) + '/behavior">行为指纹采集</a>'
          : '') +
        '<a class="btn" href="/e/' + encodeURIComponent(e.slug) + '/fingerprints">指纹数据</a>' +
        '</div></div></div>';
    });
    root.innerHTML = html;
  }

  function renderStats(rows) {
    // 统计为页面底部辅助信息，不作为标签展示
    var totalRecords = rows.reduce(function (acc, r) { return acc + r.total; }, 0);
    var behaviorCount = allEntries.filter(function (e) { return e.has_behavior; }).length;
    var html = '共 ' + allEntries.length + ' 个风控条目 · ' + totalRecords + ' 条采集记录 · ' +
      behaviorCount + ' 个含行为指纹采集';
    statRow.innerHTML = html;
  }

  function loadStats() {
    Promise.all(allEntries.map(function (e) {
      return fetchJson('/api/collections?entry_id=' + e.id + '&page=1')
        .then(function (d) { e.recordCount = d.total; return { name: e.name, total: d.total }; })
        .catch(function () { return { name: e.name, total: 0 }; });
    })).then(renderStats);
  }

  searchInput.addEventListener('input', function () {
    searchTerm = searchInput.value.trim();
    renderGrid();
  });

  fetchJson('/api/entries').then(function (entries) {
    allEntries = entries;
    buildChips();
    renderGrid();
    loadStats();
  }).catch(function (err) {
    root.innerHTML = '<div class="status error">加载失败：' + escapeHtml(err.message) + '</div>';
  });
})();
</script>
</body>
</html>
